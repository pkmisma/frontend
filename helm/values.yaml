# Defaults shared by all environments. Override per environment in values-<env>.yaml
environment: dev

replicaCount: 1

image:
  repository: europe-docker.pkg.dev/CHANGE_ME/CHANGE_ME/release-status-frontend
  tag: ""            # defaults to Chart appVersion
  full: ""           # if set (e.g. <+artifact.image> from Harness), overrides repository:tag
  pullPolicy: IfNotPresent

imagePullSecrets: []
podAnnotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

resources:
  requests: { cpu: 50m, memory: 32Mi }
  limits: { cpu: 200m, memory: 128Mi }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: false
  minAvailable: 1

spreadAcrossZones: false
