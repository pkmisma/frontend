environment: prod

image:
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  host: release-status.example.com   # CHANGE_ME

resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 2

spreadAcrossZones: true
